<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Каталог товаров</title>
</head>
<body>
    <header>
    <a href="index.html" class="logo-link" data-testid="logo">
      <img src="images/logo.png" alt="Лого ТехноМаг" class="logo-img">
    </a>

    <nav class="main-nav">
      <a href="catalog.html" class="nav-link">Каталог товаров</a>
      <a href="contacts.html" class="nav-link">Связь с нами</a>
      <a href="about.html" class="nav-link">О нас</a>
    </nav>
</header>
    <main>
    <div class="head-grid">
       <h1>Лучшие гаджеты для тебя</h1>
    </div>

    <hr>

    <div class="catalog-grid"> 
      <article class="product-card">
        <img src="images/laptop.jpg" alt="Ноутбук" class="product-image">
        <h3>Ноутбук NacBook</h3>
        <p>NacBook хорошо справляется с повседневными делами.</p>
        <span class="price">49 999 ₽</span>
        <button class="buy-button">Купить</button>
      </article>

      <article class="product-card">
        <img src="images/headphones.jpg" alt="Наушники" class="product-image">
        <h3>Наушники Som</h3>
        <p>Беспроводные наушники с защитой от влаги.</p>
        <span class="price">29 999 ₽</span>
        <button class="buy-button">Купить</button>
      </article>

      <article class="product-card">
        <img src="images/keyboard.jpg" alt="Клавиатура" class="product-image">
        <h3>Клавиатура DEF</h3>
        <p>Механическая клавиатура с RGB-подсветкой.</p>
        <span class="price">39 999 ₽</span>
        <button class="buy-button">Купить</button>
      </article>
    </div>
  </main>
</body>
</html>
